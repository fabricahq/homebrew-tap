# Preserve the workflow name called by Code Rules' existing release job. Removing or
# renaming this endpoint would let a CLI release succeed while its Homebrew dispatch fails.
# Delegate to the shared pipeline so Code Rules gets the same verification, native
# install tests, and protected publication as other tools, without a copied updater.
name: Update Code Rules
# Release Planner dispatches with tag and version. update-tool.yml resolves the latest
# stable release itself instead of trusting the caller, so both are accepted and ignored.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag from the dispatching release (ignored)
        required: false
        type: string
      version:
        description: Release version from the dispatching release (ignored)
        required: false
        type: string
permissions:
  contents: read
  issues: write
jobs:
  update:
    uses: ./.github/workflows/update-tool.yml
    with:
      tool: code-rules
    # A called workflow's job sees its environment's secrets only when the caller inherits
    # secrets; without this, publish gets an empty FORMULA_APP_PRIVATE_KEY. Only the
    # publish job, in the formula-publish environment, references a secret.
    secrets: inherit
